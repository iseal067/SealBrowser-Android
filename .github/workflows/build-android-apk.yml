name: Build Seal Browser Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build Seal Browser
        run: |
          set -e

          SETTINGS="$(find . -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "Could not find settings.gradle"
            find . -maxdepth 5 -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Found project at: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle --no-daemon :app:assembleDebug --stacktrace

          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "APK was not created"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/SealBrowser-Samsung.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SealBrowser-Samsung-APK
          path: SealBrowser-Samsung.apk
          if-no-files-found: error
