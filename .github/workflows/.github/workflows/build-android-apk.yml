name: Build Seal Browser Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find and build Seal Browser
        run: |
          set -e

          SETTINGS="$(find . -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "Could not find the Android project"
            find . -maxdepth 5 -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Found Seal Browser at: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug --stacktrace

          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "APK wasn't created"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/SealBrowser-Samsung.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SealBrowser-Samsung-APK
          path: SealBrowser-Samsung.apk
          if-no-files-found: error
